<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DENNIS Web Model Dashboard</title>
  <link rel="stylesheet" href="web-models.css">
  <script defer src="web-models.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><span class="mark">D</span><span>Web Model Dashboard</span></div>
    <nav id="provider-tabs" aria-label="Web Model providers"></nav>
    <div class="actions">
      <button data-action="back" title="Back" aria-label="Back">‹</button>
      <button data-action="forward" title="Forward" aria-label="Forward">›</button>
      <button data-action="reload" title="Reload" aria-label="Reload">↻</button>
    </div>
  </header>
  <main id="workspace">
    <div class="welcome">
      <div class="welcome-icon">✦</div>
      <h1>Web Model Dashboard</h1>
      <p>Choose a provider to use its web app here. This dashboard has separate sign-in profiles and does not use Agent CLI sessions.</p>
    </div>
  </main>
</body>
</html>
